name: Build and Release

on:
  push:
    branches: [ main, master, 'copilot/**' ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build SpaceMonger (Win32 Release)
        run: |
          msbuild SpaceMonger.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /m

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceMonger-Win32
          path: Release\SpaceMonger.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SpaceMonger-Win32

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SpaceMonger ${{ github.ref_name }}
          body: |
            SpaceMonger Windows executable (32-bit, runs on Windows x64 via WOW64).

            **Download:** `SpaceMonger.exe`

            No installation required — just download and run.
          files: SpaceMonger.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
